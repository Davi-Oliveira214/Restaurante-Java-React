spring.application.name=restaurante

# Spring dev tools
spring.devtools.restart.enabled=true
logging.level.org.springframework=INFO

# Variáveis de ambiente
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bd_restaurante}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:senha}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Cors
app.cors.allowed-origins=${CORS}

# JWT Key
app.jwt.key=${JWT_KEY}

# Expire time token
app.expire.token=${EXPIRE_TOKEN:120}